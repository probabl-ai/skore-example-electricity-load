    <style>
     html {
    font-family: sans-serif;
    --current-node-color: #15ed8f;
}

h1,h2,h3,h4 {
    margin-top: 0.6em;
    margin-bottom: 0.2em;
    margin-left: 0;
    margin-right: 0;
}
h1 {
    margin-top: 0;
}

ul {
    margin: 0.1em;
}

* *::before, *::after {
    box-sizing: border-box;
}

pre, code {
    font-size: 1rem;
}

.docstring-details summary {
    cursor: pointer;
}

.docstring-details {
    margin: 1em 0;
}

#graph-nav text {
    transform: translateY(2px);
}

.data_op-node-wrapper {
    overflow-x: auto;
}

.mini-nav > ul {
    display: grid;
    grid-template-columns: 10ch 10ch 10ch;
    list-style-type: none;
}

.data_op-node {
    display: flex;
    height: 100%;
}

.data_op-node > * {
    padding: 1rem;
    max-height: 100%;
    overflow-y: auto;
}

.data_op-node > nav.main-nav {
    border-right: 2px solid #ccc;
    flex-shrink: 0;
}

.node-details {
    flex-grow: 1;
    flex-shrink: 1;
}

.data_op-node > nav.main-nav {
    resize: horizontal;
    min-width: 8rem;
    /* A wide graph scrolls rather than squeezing the node details. */
    max-width: 75vw;
    box-sizing: border-box;
}

.data_op-node > .node-frame {
    flex-grow: 1;
    flex-shrink: 1;
    min-width: 0;
    padding: 0;
    border: none;
    width: 100%;
    height: 100%;
}

/* Node pages are displayed inside the iframe of the index page: they fill it
   and scroll as a whole. */
.node-page {
    margin: 0;
}

.node-page .data_op-node {
    display: block;
    height: auto;
}

.node-page .data_op-node > * {
    max-height: none;
    overflow-y: visible;
}

.node-page .node-details {
    min-height: 100vh;
}

.node-details[data-has-error]{
    background: #ffcccc;
}

.node-details[data-is-skipped]{
    background: #eee;
}

.is-skipped-message{
    background: #eee;
    padding: 0 1em 1em 1em;
    border: 1px solid black;
}

.is-skipped-message + * {
    margin-top: 1em;
}

.node-creation-stack {
    font-size: 1rem;
}

.node-creation-stack a {
    text-decoration: none;
}

.node-creation-stack .node-creation-stack-line {
    display: block;
    margin-left: 2em;
}

.main-nav:not([data-is-open]){
    display: none;
}

.nav-legend-current-node {
    display: flex;
    background: var(--current-node-color);
    border: 4px solid black;
    font-size: 1.2rem;
    padding: 3px;
}

.nav-legend-current-node + * {
    margin-top: 2rem;
}

/* Layout of the index page: a header (toggle button and report title), below
   it the graph and the iframe displaying the selected node. */
.report-index {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.report-header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
}

.report-index > .data_op-node-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.report-index .data_op-node {
    flex: 1;
    min-height: 0;
}

.icon-button {
    flex: none;
    padding: 2px;
    width: 24px;
    height: 24px;
}

.report-title {
    margin: 0;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.error-node polygon {
    stroke: red;
    stroke-width: 3;
}

.skipped-node polygon {
    stroke-dasharray: 4;
}
    </style>

<script>
 (function() {
    // Node pages are displayed in the iframe and tell us which node they show
    // (see node.html). We cannot read the iframe's location ourselves: for
    // file:// URLs browsers treat it as cross-origin.
    //
    // The current node is highlighted with a CSS rule rather than by editing
    // the graph, so that it does not matter whether the graph is already
    // there: it may be rendered later by the browser (when graphviz is not
    // installed).
    const frame = document.getElementById('node-frame');
    const highlightStyle = document.getElementById('current-node-style');

    window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow) {
            return;
        }
        if (!event.data || event.data.type !== 'skrub-report-node-shown') {
            return;
        }
        const nodeId = event.data.nodeId;
        // nodeId is null for pages that do not show a particular node
        highlightStyle.textContent = (nodeId === null) ? '' : (
            `#node_${Number(nodeId)} polygon {` +
            ' fill: var(--current-node-color); stroke-width: 3; }');
    });

    document.getElementById('toggle-nav').addEventListener('click', () => {
        document.querySelector('nav').toggleAttribute('data-is-open');
    });
})();
</script>
