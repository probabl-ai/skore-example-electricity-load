[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electricity-load-forecasting"
version = "0.1.0"
description = "French electricity load forecasting experiments with skore and skrub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "holidays",
    "numpy",
    "plotly",
    "polars>=1.44,<2",
    "scikit-learn",
    "scipy",
    "skrub",
    "joblib",
    "optuna",
    "optuna-dashboard",
]

[project.optional-dependencies]
chronos = [
    "chronos-forecasting",
    "torch",
]
tabicl = [
    "tabicl",
]
skore = [
    "python-dotenv",
    "skore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/electricity_load_forecasting"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pre-commit = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
electricity-load-forecasting = { path = ".", editable = true, extras = ["skore"] }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
pre-commit = "pre-commit run --all-files"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
